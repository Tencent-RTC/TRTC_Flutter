// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.tencent.trtcplugin'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.2.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()

    }
}

apply plugin: 'com.android.library'

android {
    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 31

    if (project.android.hasProperty("flutter")) {
        ndkVersion flutter.ndkVersion
    } else {
        ndkVersion "21.4.7075529"
    }

    if (project.android.hasProperty("namespace")) {
        namespace "com.tencent.trtcplugin"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }
}

// Single source of the underlying LiteAVSDK series/version; super_player follows these.
def liteavSdkGroupId = "com.tencent.liteav"
def liteavSdkModule = "LiteAVSDK_Professional"
def liteavSdkVersion = "13.6.0.20747"
rootProject.ext.rtcSdkLiteavSdkGroupId = liteavSdkGroupId
rootProject.ext.rtcSdkLiteavSdkModule = liteavSdkModule
rootProject.ext.rtcSdkLiteavSdkVersion = liteavSdkVersion
println("[TencentRTC] liteavSdk: ${liteavSdkGroupId}:${liteavSdkModule}:${liteavSdkVersion}")

dependencies {
    api "${liteavSdkGroupId}:${liteavSdkModule}:${liteavSdkVersion}"
    api 'com.tencent.liteav:custom-video-processor:1.0.1'
}

